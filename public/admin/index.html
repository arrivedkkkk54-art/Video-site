<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viraldhamka - Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050505; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-box { background: #0a0a0a; border: 1px solid #111; border-radius: 20px; padding: 50px 40px; width: 100%; max-width: 400px; text-align: center; }
    .login-box .logo { font-size: 32px; font-weight: 900; letter-spacing: -2px; margin-bottom: 8px; background: linear-gradient(135deg, #fff 0%, #666 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .login-box .logo span { background: linear-gradient(135deg, #ff3366 0%, #ff6b35 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .login-box .subtitle { color: #333; font-size: 13px; margin-bottom: 35px; text-transform: uppercase; letter-spacing: 3px; }
    .login-box input { width: 100%; padding: 16px; background: #050505; border: 1px solid #1a1a1a; border-radius: 12px; color: #fff; font-size: 18px; text-align: center; letter-spacing: 8px; margin-bottom: 20px; outline: none; transition: 0.3s; }
    .login-box input:focus { border-color: #ff3366; }
    .login-box input::placeholder { letter-spacing: normal; color: #222; font-size: 14px; }
    .login-box button { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff3366 0%, #ff6b35 100%); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; }
    .login-box button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,51,102,0.3); }
    .login-error { color: #ff4444; font-size: 13px; margin-top: 15px; display: none; }
    .dashboard { display: none; }
    .topbar { background: #050505; padding: 18px 30px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .topbar .logo { font-size: 22px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(135deg, #fff 0%, #666 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .topbar .logo span { background: linear-gradient(135deg, #ff3366 0%, #ff6b35 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .topbar .logo small { font-size: 12px; color: #333; font-weight: 400; letter-spacing: 1px; margin-left: 10px; }
    .logout-btn { background: transparent; border: 1px solid #1a1a1a; color: #444; padding: 10px 24px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.3s; }
    .logout-btn:hover { border-color: #ff4444; color: #ff4444; }
    .container { max-width: 1000px; margin: 0 auto; padding: 25px 20px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 25px; }
    @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
    .stat { background: #0a0a0a; border: 1px solid #111; border-radius: 14px; padding: 22px; text-align: center; }
    .stat-num { font-size: 32px; font-weight: 900; background: linear-gradient(135deg, #ff3366 0%, #ff6b35 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stat-label { color: #333; font-size: 12px; margin-top: 6px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
    .add-box { background: #0a0a0a; border: 1px solid #111; border-radius: 16px; padding: 28px; margin-bottom: 25px; }
    .add-box h2 { font-size: 16px; margin-bottom: 22px; color: #fff; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    .form-group label { display: block; margin-bottom: 8px; color: #444; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
    .form-group input, .form-group textarea { width: 100%; padding: 14px; background: #050505; border: 1px solid #1a1a1a; border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
    .form-group input:focus, .form-group textarea:focus { border-color: #ff3366; }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-group small { color: #222; font-size: 11px; margin-top: 6px; display: block; }
    .btn-add { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff3366 0%, #ff6b35 100%); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255,51,102,0.3); }
    .btn-add:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .list-header h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
    .badge { background: #ff336620; color: #ff3366; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .table-wrap { background: #0a0a0a; border: 1px solid #111; border-radius: 16px; overflow: hidden; }
    .table-head { display: grid; grid-template-columns: 45px 1fr 180px 80px 90px; padding: 14px 20px; background: #050505; color: #333; font-size: 10px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
    .table-row { display: grid; grid-template-columns: 45px 1fr 180px 80px 90px; padding: 14px 20px; border-top: 1px solid #111; align-items: center; }
    .table-row:hover { background: #0d0d0d; }
    .t-num { color: #333; font-size: 13px; }
    .t-title { font-size: 14px; font-weight: 500; }
    .t-url { color: #333; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .t-status { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-align: center; background: #00ff8815; color: #00ff88; width: fit-content; }
    .t-actions { display: flex; gap: 6px; }
    .t-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid #1a1a1a; background: transparent; color: #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: 0.3s; }
    .t-btn:hover { background: #ff444420; border-color: #ff4444; color: #ff4444; }
    .t-btn.copy:hover { background: #00d4ff20; border-color: #00d4ff; color: #00d4ff; }
    .empty { text-align: center; padding: 60px 20px; color: #222; }
    .empty div { font-size: 40px; margin-bottom: 10px; }
    .toast { position: fixed; bottom: 25px; right: 25px; background: #0a0a0a; border: 1px solid #1a1a1a; color: #fff; padding: 14px 24px; border-radius: 12px; transform: translateY(100px); opacity: 0; transition: 0.4s; z-index: 1000; font-size: 13px; font-weight: 600; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: #00ff8840; color: #00ff88; }
    .toast.error { border-color: #ff444440; color: #ff4444; }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <div class="login-box">
      <div class="logo">Viral<span>dhamka</span></div>
      <div class="subtitle">Admin Panel</div>
      <input type="password" id="adminPass" placeholder="Enter password" maxlength="20">
      <button onclick="login()">Enter</button>
      <div class="login-error" id="loginError">Wrong password!</div>
    </div>
  </div>
  <div class="dashboard" id="dashboard">
    <div class="topbar">
      <div class="logo">Viral<span>dhamka</span> <small>ADMIN</small></div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <div class="container">
      <div class="stats">
        <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total Videos</div></div>
        <div class="stat"><div class="stat-num" id="statToday">0</div><div class="stat-label">Today</div></div>
        <div class="stat"><div class="stat-num" id="statViews">0</div><div class="stat-label">Total Views</div></div>
      </div>
      <div class="add-box">
        <h2>➕ Add Video</h2>
        <div class="form-row">
          <div class="form-group"><label>Title</label><input type="text" id="videoTitle" placeholder="Video title"></div>
          <div class="form-group"><label>LuluStream Link</label><input type="text" id="luluLink" placeholder="https://luluvid.com/xxxx"></div>
        </div>
        <div class="form-group" style="margin-bottom: 20px;"><label>Description</label><textarea id="videoDesc" placeholder="Optional..."></textarea><small>Paste LuluStream link. System auto-converts to embed!</small></div>
        <button class="btn-add" id="addBtn" onclick="addVideo()">Add Video</button>
      </div>
      <div class="list-header"><h2>📹 Videos</h2><span class="badge" id="videoCount">0 videos</span></div>
      <div class="table-wrap">
        <div class="table-head"><div>#</div><div>Title</div><div>URL</div><div>Status</div><div></div></div>
        <div id="videoList"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast">Done!</div>
  <script>
    let token = localStorage.getItem('vdAdminToken');
n    if (token) { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; loadData(); }
    async function login() {
      const pass = document.getElementById('adminPass').value;
      try {
        const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pass }) });
        const data = await res.json();
        if (data.success) { token = data.token; localStorage.setItem('vdAdminToken', token); document.getElementById('loginScreen').style.display = 'none'; document.getElementById('dashboard').style.display = 'block'; loadData(); }
        else { document.getElementById('loginError').style.display = 'block'; setTimeout(() => document.getElementById('loginError').style.display = 'none', 3000); }
      } catch(err) { showToast('Server error!', 'error'); }
    }
    document.getElementById('adminPass').addEventListener('keypress', (e) => { if (e.key === 'Enter') login(); });
    function logout() { localStorage.removeItem('vdAdminToken'); token = null; document.getElementById('loginScreen').style.display = 'flex'; document.getElementById('dashboard').style.display = 'none'; document.getElementById('adminPass').value = ''; }
    async function loadData() { await Promise.all([loadStats(), loadVideos()]); }
    async function loadStats() {
      try { const res = await fetch('/api/admin/stats'); const data = await res.json(); if (data.success) { document.getElementById('statTotal').textContent = data.stats.total; document.getElementById('statToday').textContent = data.stats.today; document.getElementById('statViews').textContent = data.stats.views; } }
      catch(err) {}
    }
    async function addVideo() {
      const title = document.getElementById('videoTitle').value.trim();
      const luluUrl = document.getElementById('luluLink').value.trim();
      const desc = document.getElementById('videoDesc').value.trim();
      const btn = document.getElementById('addBtn');
      if (!title || !luluUrl) { showToast('Title and URL required!', 'error'); return; }
      btn.disabled = true; btn.textContent = 'Adding...';
      try {
        const res = await fetch('/api/videos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, luluUrl, description: desc }) });
        const data = await res.json();
        if (data.success) { showToast('✅ Video added!'); document.getElementById('videoTitle').value = ''; document.getElementById('luluLink').value = ''; document.getElementById('videoDesc').value = ''; loadData(); }
        else { showToast(data.error || 'Error!', 'error'); }
      } catch(err) { showToast('Network error!', 'error'); }
      btn.disabled = false; btn.textContent = 'Add Video';
    }
    async function deleteVideo(id) {
      if (!confirm('Delete this video?')) return;
      try { await fetch('/api/videos/' + id, { method: 'DELETE' }); showToast('🗑️ Deleted!'); loadData(); }
      catch(err) { showToast('Error!', 'error'); }
    }
    async function copyEmbed(id) {
      try { const res = await fetch('/api/videos/' + id); const data = await res.json(); if (!data.success) return; const code = '<iframe src="' + data.video.embed_url + '" scrolling="no" frameborder="0" width="640" height="360" allowfullscreen></iframe>'; await navigator.clipboard.writeText(code); showToast('📋 Copied!'); }
      catch(err) {}
    }
    async function loadVideos() {
      try {
        const res = await fetch('/api/videos');
        const data = await res.json();
        const list = document.getElementById('videoList');
        document.getElementById('videoCount').textContent = (data.videos?.length || 0) + ' videos';
        if (!data.videos || data.videos.length === 0) { list.innerHTML = '<div class="empty"><div>📂</div><p>No videos yet</p></div>'; return; }
        list.innerHTML = data.videos.map((v, i) => '<div class="table-row"><div class="t-num">' + (i + 1) + '</div><div class="t-title">' + v.title + '</div><div class="t-url" title="' + v.lulu_url + '">' + v.lulu_url + '</div><div><span class="t-status">Active</span></div><div class="t-actions"><button class="t-btn copy" onclick="copyEmbed(' + v.id + ')" title="Copy">📋</button><button class="t-btn" onclick="deleteVideo(' + v.id + ')" title="Delete">🗑️</button></div></div>').join('');
      } catch(err) { document.getElementById('videoList').innerHTML = '<div class="empty"><div>❌</div><p>Error loading</p></div>'; }
    }
    function showToast(msg, type) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.className = 'toast ' + (type || 'success'); toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }
  </script>
</body>
  </html>
