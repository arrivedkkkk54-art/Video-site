<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viraldhamka</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050505; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; }
    .header { background: #050505; padding: 20px 30px; border-bottom: 1px solid #111; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 28px; font-weight: 900; letter-spacing: -2px; background: linear-gradient(135deg, #fff 0%, #666 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo span { background: linear-gradient(135deg, #ff3366 0%, #ff6b35 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .main { max-width: 900px; margin: 0 auto; padding: 25px 15px; }
    .video-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
    @media (max-width: 600px) { .video-grid { grid-template-columns: 1fr; } }
    .video-card { background: #0a0a0a; border-radius: 12px; overflow: hidden; border: 1px solid #111; transition: all 0.3s ease; }
    .video-card:hover { border-color: #222; transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .thumb { position: relative; padding-bottom: 56.25%; background: #000; overflow: hidden; }
    .thumb iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .info { padding: 12px 14px; }
    .info h3 { font-size: 14px; font-weight: 600; color: #fff; line-height: 1.4; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; align-items: center; gap: 10px; color: #444; font-size: 11px; }
    .meta .dot { width: 3px; height: 3px; background: #333; border-radius: 50%; }
    .loading { grid-column: 1 / -1; text-align: center; padding: 100px 20px; }
    .spinner { width: 40px; height: 40px; border: 2px solid #111; border-top-color: #ff3366; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: #333; font-size: 14px; }
    .empty { grid-column: 1 / -1; text-align: center; padding: 120px 20px; }
    .empty-icon { font-size: 60px; margin-bottom: 20px; opacity: 0.3; }
    .empty h2 { color: #333; font-size: 18px; margin-bottom: 8px; }
    .empty p { color: #222; font-size: 13px; }
    .footer { text-align: center; padding: 40px 20px; color: #1a1a1a; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>
  <header class="header"><div class="logo">Viral<span>dhamka</span></div></header>
  <main class="main">
    <div class="video-grid" id="videoGrid">
      <div class="loading"><div class="spinner"></div><p>Loading videos...</p></div>
    </div>
  </main>
  <footer class="footer">Viraldhamka</footer>
  <script>
    async function loadVideos() {
      try {
        const res = await fetch('/api/videos');
        const data = await res.json();
        const grid = document.getElementById('videoGrid');
        if (!data.success || !data.videos || data.videos.length === 0) {
          grid.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><h2>No videos yet</h2><p>Check back later!</p></div>';
          return;
        }
        grid.innerHTML = data.videos.map(v => '<div class="video-card"><div class="thumb"><iframe src="' + v.embed_url + '" scrolling="no" frameborder="0" allowfullscreen="true" loading="lazy" title="' + v.title + '"></iframe></div><div class="info"><h3>' + v.title + '</h3><div class="meta"><span>▶ ' + (v.views || 0) + ' views</span><span class="dot"></span><span>' + new Date(v.created_at).toLocaleDateString() + '</span></div></div></div>').join('');
      } catch(err) { document.getElementById('videoGrid').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><h2>Error</h2><p>Refresh please</p></div>'; }
    }
    loadVideos(); setInterval(loadVideos, 30000);
  </script>
</body>
</html>
